name: truthlens
description: "Offline image manipulation and splicing detector — see the truth behind every image."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Image capture + processing
  image_picker: ^1.0.7
  image: ^4.1.7
  exif: ^3.3.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # UI / animation
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  gap: ^3.0.1

  # Platform integration
  share_plus: ^7.2.2
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.3.3
  path: ^1.9.0

  # On-device AI image classifier (Swin ViT, int8 quantized)
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/ai_detector.onnx
